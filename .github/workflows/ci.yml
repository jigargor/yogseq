name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm --filter @yogseq/web build
        env:
          BETTER_AUTH_SECRET: ci-build-secret-not-for-production-use
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:build
      - name: Deploy preview
        working-directory: apps/web
        run: |
          echo "Preview deploy requires CLOUDFLARE_API_TOKEN. Skipping if unset."
          echo "Preview versions must NOT use yogseq.metierstudio.com — workers.dev / version URL only."
          export NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL:-https://yogseq.metierstudio.org}"
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            pnpm exec opennextjs-cloudflare build
            pnpm exec wrangler versions upload
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}

  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:build
      - name: Build OpenNext bundle
        working-directory: apps/web
        run: |
          # NEXT_PUBLIC_* are inlined at OpenNext build. Worker runtime secrets
          # (DATABASE_URL, BETTER_AUTH_*, RESEND_*, GOOGLE_*) must still be set
          # once via: pnpm exec wrangler secret put <NAME> (see docs/metier-deploy.md).
          export NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL:-https://yogseq.metierstudio.org}"
          pnpm exec opennextjs-cloudflare build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}
      - name: Upload OpenNext artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-next-yogseq
          path: |
            apps/web/.open-next
            apps/web/wrangler.jsonc
          retention-days: 3
      - name: Deploy production
        working-directory: apps/web
        run: |
          # Requires a Cloudflare API Token (Edit Cloudflare Workers), not a Wrangler OAuth token.
          # Create at https://dash.cloudflare.com/profile/api-tokens — template "Edit Cloudflare Workers".
          # Until that secret is a real API token, download the open-next-yogseq artifact and run:
          #   pnpm exec wrangler deploy
          # from apps/web after extracting .open-next (see docs/metier-deploy.md).
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN unset — skipping wrangler deploy (artifact uploaded)"
            exit 0
          fi
          if ! pnpm exec wrangler deploy; then
            echo "::warning::wrangler deploy failed (often OAuth token used as API token). Artifact open-next-yogseq was uploaded for local deploy."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
